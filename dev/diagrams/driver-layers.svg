<rect x="32" y="723.4" width="1136" height="89" rx="12" fill="#FFFFFF" stroke="#C9D1DB" stroke-width="1"/>
<rect x="32" y="731.4" width="4" height="73" rx="2" fill="#64748B"/>
<text x="56" y="184.4" font-size="20" font-weight="700" fill="#17202C">Your application</text>
<text x="56" y="215" font-size="17" fill="#2B3442">thermal monitoring, derating, fan control ...</text>
<rect x="48" y="323.4" width="98.4" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="56" y="341.5" font-size="16" font-weight="700" fill="#3730A3">Initialize()</text>
<rect x="154.4" y="323.4" width="120.6" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="162.4" y="341.5" font-size="16" font-weight="700" fill="#3730A3">Deinitialize()</text>
<rect x="282.9" y="323.4" width="240.2" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="290.9" y="341.5" font-size="16" font-weight="700" fill="#3730A3">ReadTemperatureCelsius()</text>
<rect x="531.1" y="323.4" width="135.1" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="539.1" y="341.5" font-size="16" font-weight="700" fill="#3730A3">ReadVoltage()</text>
<rect x="674.2" y="323.4" width="187.2" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="682.2" y="341.5" font-size="16" font-weight="700" fill="#3730A3">SetSpecifiedRange()</text>
<rect x="869.4" y="323.4" width="199.8" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="877.4" y="341.5" font-size="16" font-weight="700" fill="#3730A3">SpecifiedMinCelsius()</text>
<rect x="48" y="357.4" width="204.3" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="56" y="375.5" font-size="16" font-weight="700" fill="#3730A3">SpecifiedMaxCelsius()</text>
<rect x="260.3" y="357.4" width="201" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="268.3" y="375.5" font-size="16" font-weight="700" fill="#3730A3">RangeMarginCelsius()</text>
<rect x="469.3" y="357.4" width="205.3" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="477.3" y="375.5" font-size="16" font-weight="700" fill="#3730A3">HasValidCoefficients()</text>
<rect x="682.5" y="357.4" width="142.3" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="690.5" y="375.5" font-size="16" font-weight="700" fill="#3730A3">VoltsAtZeroC()</text>
<rect x="832.8" y="357.4" width="161.6" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="840.8" y="375.5" font-size="16" font-weight="700" fill="#3730A3">VoltsPerCelsius()</text>
<text x="48" y="307.4" font-size="17" font-weight="700" fill="#3730A3">HARDWARE-AGNOSTIC CORE</text>
<text x="326.2" y="307.4" font-size="16" fill="#3730A3">Mcp9700Thermistor&lt;AdcType&gt;, inc/mcp9700_thermistor.hpp</text>
<text x="56" y="476.4" font-size="20" font-weight="700" fill="#3730A3">ADC adapter contract</text>
<text x="56" y="507" font-size="17" fill="#2B3442">The AdcType template parameter: any class with these two methods, checked at compile time,</text>
<text x="56" y="531.7" font-size="17" fill="#2B3442">no base class; T = (V - v_zero_c) / v_per_c is applied in the core above it</text>
<text x="56" y="630.4" font-size="20" font-weight="700" fill="#115E59">Platform adapter (your class)</text>
<text x="56" y="659.6" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#2B3442">EnsureInitialized()  ReadChannelV()</text>
<text x="56" y="758.4" font-size="20" font-weight="700" fill="#17202C">MCU ADC and MCP9700</text>
<text x="56" y="789" font-size="17" fill="#2B3442">ADC input on VOUT: 100 mV to 1.75 V over −40 °C to +125 °C, 500 mV at 0 °C, 10 mV/°C</text>
<rect x="32" y="824.8" width="14" height="14" rx="4" fill="#EEF0FF" stroke="#4F46E5" stroke-width="1.4"/>
<text x="54" y="839.4" font-size="16" fill="#566070">this library</text>
<rect x="161.8" y="824.8" width="14" height="14" rx="4" fill="#E6F6F4" stroke="#0F8B80" stroke-width="1.4"/>
<text x="183.8" y="839.4" font-size="16" fill="#566070">you write</text>
<rect x="282.1" y="824.8" width="14" height="14" rx="4" fill="#F1F4F8" stroke="#64748B" stroke-width="1.4"/>
<text x="304.1" y="839.4" font-size="16" fill="#566070">hardware</text>
</svg>
