<path d="M600 559.4 L600 591.4" fill="none" stroke="#6C7889" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<path d="M600 687.4 L600 719.4" fill="none" stroke="#6C7889" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<rect x="32" y="149.4" width="1136" height="89" rx="12" fill="#151C26" stroke="#3A4657" stroke-width="1"/>
<rect x="32" y="157.4" width="4" height="73" rx="2" fill="#94A3B8"/>
<rect x="32" y="441.4" width="1136" height="114" rx="12" fill="#1C1F3D" stroke="#8C93FF" stroke-width="1.4"/>
<rect x="32" y="449.4" width="4" height="98" rx="2" fill="#8C93FF"/>
<rect x="32" y="595.4" width="1136" height="88" rx="12" fill="#0F2A28" stroke="#2DD4BF" stroke-width="1.4"/>
<rect x="32" y="603.4" width="4" height="72" rx="2" fill="#2DD4BF"/>
<rect x="32" y="723.4" width="1136" height="89" rx="12" fill="#151C26" stroke="#3A4657" stroke-width="1"/>
<rect x="32" y="731.4" width="4" height="73" rx="2" fill="#94A3B8"/>
<text x="56" y="184.4" font-size="20" font-weight="700" fill="#E8EDF3">Your application</text>
<text x="56" y="215" font-size="17" fill="#D2DAE4">thermal monitoring, derating, fan control ...</text>
<rect x="48" y="323.4" width="98.4" height="26" rx="13" fill="#1C1F3D" stroke="#3B4080" stroke-width="1"/>
<text x="56" y="341.5" font-size="16" font-weight="700" fill="#C7CBFF">Initialize()</text>
<rect x="154.4" y="323.4" width="120.6" height="26" rx="13" fill="#1C1F3D" stroke="#3B4080" stroke-width="1"/>
<text x="162.4" y="341.5" font-size="16" font-weight="700" fill="#C7CBFF">Deinitialize()</text>
<rect x="282.9" y="323.4" width="240.2" height="26" rx="13" fill="#1C1F3D" stroke="#3B4080" stroke-width="1"/>
<text x="290.9" y="341.5" font-size="16" font-weight="700" fill="#C7CBFF">ReadTemperatureCelsius()</text>
<rect x="531.1" y="323.4" width="135.1" height="26" rx="13" fill="#1C1F3D" stroke="#3B4080" stroke-width="1"/>
<text x="539.1" y="341.5" font-size="16" font-weight="700" fill="#C7CBFF">ReadVoltage()</text>
<rect x="674.2" y="323.4" width="187.2" height="26" rx="13" fill="#1C1F3D" stroke="#3B4080" stroke-width="1"/>
<text x="682.2" y="341.5" font-size="16" font-weight="700" fill="#C7CBFF">SetSpecifiedRange()</text>
<rect x="869.4" y="323.4" width="199.8" height="26" rx="13" fill="#1C1F3D" stroke="#3B4080" stroke-width="1"/>
<text x="877.4" y="341.5" font-size="16" font-weight="700" fill="#C7CBFF">SpecifiedMinCelsius()</text>
<rect x="48" y="357.4" width="204.3" height="26" rx="13" fill="#1C1F3D" stroke="#3B4080" stroke-width="1"/>
<text x="56" y="375.5" font-size="16" font-weight="700" fill="#C7CBFF">SpecifiedMaxCelsius()</text>
<rect x="260.3" y="357.4" width="201" height="26" rx="13" fill="#1C1F3D" stroke="#3B4080" stroke-width="1"/>
<text x="268.3" y="375.5" font-size="16" font-weight="700" fill="#C7CBFF">RangeMarginCelsius()</text>
<rect x="469.3" y="357.4" width="142.3" height="26" rx="13" fill="#1C1F3D" stroke="#3B4080" stroke-width="1"/>
<text x="477.3" y="375.5" font-size="16" font-weight="700" fill="#C7CBFF">VoltsAtZeroC()</text>
<rect x="619.5" y="357.4" width="161.6" height="26" rx="13" fill="#1C1F3D" stroke="#3B4080" stroke-width="1"/>
<text x="627.5" y="375.5" font-size="16" font-weight="700" fill="#C7CBFF">VoltsPerCelsius()</text>
<text x="48" y="307.4" font-size="17" font-weight="700" fill="#C7CBFF">HARDWARE-AGNOSTIC CORE</text>
<text x="326.2" y="307.4" font-size="16" fill="#C7CBFF">Mcp9700Thermistor&lt;AdcType&gt;, inc/mcp9700_thermistor.hpp</text>
<text x="56" y="476.4" font-size="20" font-weight="700" fill="#C7CBFF">ADC adapter contract</text>
<text x="56" y="507" font-size="17" fill="#D2DAE4">The AdcType template parameter: any class with these two methods, checked at compile time,</text>
<text x="56" y="531.7" font-size="17" fill="#D2DAE4">no base class; T = (V - v_zero_c) / v_per_c is applied in the core above it</text>
<text x="56" y="630.4" font-size="20" font-weight="700" fill="#A7F3E6">Platform adapter (your class)</text>
<text x="56" y="659.6" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">EnsureInitialized()  ReadChannelV()</text>
<text x="56" y="758.4" font-size="20" font-weight="700" fill="#E8EDF3">MCU ADC and MCP9700</text>
<text x="56" y="789" font-size="17" fill="#D2DAE4">ADC input on VOUT: 100 mV to 1.75 V over −40 °C to +125 °C, 500 mV at 0 °C, 10 mV/°C</text>
<rect x="32" y="824.8" width="14" height="14" rx="4" fill="#1C1F3D" stroke="#8C93FF" stroke-width="1.4"/>
<text x="54" y="839.4" font-size="16" fill="#9AA6B5">this library</text>
<rect x="161.8" y="824.8" width="14" height="14" rx="4" fill="#0F2A28" stroke="#2DD4BF" stroke-width="1.4"/>
<text x="183.8" y="839.4" font-size="16" fill="#9AA6B5">you write</text>
<rect x="282.1" y="824.8" width="14" height="14" rx="4" fill="#1B232E" stroke="#94A3B8" stroke-width="1.4"/>
<text x="304.1" y="839.4" font-size="16" fill="#9AA6B5">hardware</text>
</svg>
